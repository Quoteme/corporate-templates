name: Generate example PDFs and previews

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Compile examples
        run: |
          mkdir -p dist
          for name in day-recap study-evaluation study letter-of-recommendation; do
            typst compile --root . "examples/$name.typ" "dist/$name.pdf"
            typst compile --root . "examples/$name.typ" "dist/$name.png" --pages 1 --ppi 150
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
